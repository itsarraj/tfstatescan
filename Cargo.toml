[package]
name = "tfstatescan"
version = "0.1.0"
edition = "2021"
description = "Scans a Terraform .tfstate file for plaintext secrets persisted in resource attributes — the aws_db_instance.password / random_password.result footgun"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/tfstatescan"
readme = "README.md"
keywords = ["terraform", "tfstate", "security", "secrets", "audit"]
categories = ["command-line-utilities"]

[lib]
name = "tfstatescan"
path = "src/lib.rs"

[[bin]]
name = "tfstatescan"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
